<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduGenie - AI Learning Assistant</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="container">

            <div class="logo">
                EduGenie
            </div>

            <p>
                Google Gemini Powered Learning Assistant
            </p>

        </div>

    </header>


    <main class="container main-content">

        <section class="hero">

            <h1>
                Learn Smarter with EduGenie
            </h1>

            <p>
                Ask questions, understand concepts,
                generate quizzes, summarize text,
                and create personalized learning paths.
            </p>

        </section>


        <section class="card">

            <label for="task">
                Select Task
            </label>

            <select id="task">

                <option value="qa">
                    Ask a Question
                </option>

                <option value="explain">
                    Explain a Topic
                </option>

                <option value="quiz">
                    Generate Quiz
                </option>

                <option value="summarize">
                    Summarize Text
                </option>

                <option value="learn">
                    Recommend Learning Path
                </option>

            </select>


            <div id="level-container">

                <label for="level">
                    Learning Level
                </label>

                <select id="level">

                    <option value="beginner">
                        Beginner
                    </option>

                    <option value="intermediate">
                        Intermediate
                    </option>

                    <option value="advanced">
                        Advanced
                    </option>

                </select>

            </div>


            <div id="weeks-container" class="hidden">

                <label for="weeks">
                    Number of Weeks
                </label>

                <input
                    id="weeks"
                    type="number"
                    min="1"
                    max="52"
                    value="4"
                >

            </div>


            <label for="input-text">
                Your Input
            </label>

            <textarea
                id="input-text"
                rows="10"
                placeholder="Enter your question, topic, or text here..."
            ></textarea>


            <div class="buttons">

                <button
                    id="generate-btn"
                    class="primary-btn"
                >
                    Generate
                </button>

                <button
                    id="clear-btn"
                    class="secondary-btn"
                >
                    Clear
                </button>

            </div>


            <div
                id="status"
                class="status"
            ></div>


            <section
                id="result"
                class="result"
            ></section>

        </section>

    </main>


    <footer>

        <p>
            EduGenie © 2026 | AI Learning Assistant
        </p>

    </footer>


    <script src="/static/app.js"></script>

</body>

</html>
